name: 申请删除或下架作品
description: 申请从社区网站移除一条作品或小鸭分享。
title: "[下架申请] "
body:
  - type: markdown
    attributes:
      value: 填写后由社区维护者核对处理。此申请只针对社区展示，不会删除原平台上的作品。
  - type: input
    id: entry-name
    attributes:
      label: 作品名称
    validations:
      required: true
  - type: input
    id: entry-url
    attributes:
      label: 社区展示链接
      placeholder: https://luwudynamics.github.io/xgoduck_community/projects/...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 下架原因
      placeholder: 请说明申请下架的原因，以及你与作品的关系。
    validations:
      required: true
